<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hardstyle Audio Mastering Suite</title>
  <style>
    :root {
      --bg-color: #0a0a12;
      --panel-bg: #121220;
      --accent-neon: #00ffcc;
      --accent-pink: #ff0055;
      --text-main: #e0e0e0;
      --border-color: #2a2a40;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 20px;
    }

    .main-panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.1);
    }

    .sidebar {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
    }

    h1, h2, h3 {
      color: var(--accent-neon);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 0;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      height: 200px;
      background: #000;
      border: 1px solid var(--accent-neon);
      border-radius: 4px;
      margin-bottom: 20px;
    }

    canvas {
      width: 100%;
      height: 100%;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .control-group {
      background: #1a1a2e;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .control-group label {
      display: block;
      font-size: 0.85em;
      margin-bottom: 8px;
      color: var(--accent-neon);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent-neon);
    }

    .btn {
      background: transparent;
      border: 1px solid var(--accent-neon);
      color: var(--accent-neon);
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--accent-neon);
      color: #000;
      box-shadow: 0 0 10px var(--accent-neon);
    }

    .btn-active {
      background: var(--accent-pink) !important;
      border-color: var(--accent-pink) !important;
      color: #fff !important;
      box-shadow: 0 0 10px var(--accent-pink);
    }

    .meter-bar {
      height: 15px;
      background: #222;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 5px;
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-neon), var(--accent-pink));
      transition: width 0.1s;
    }

    .file-input {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="main-panel">
      <h1>Hardstyle Mastering Suite</h1>
      
      <div class="file-input">
        <input type="file" id="audioFile" accept="audio/*">
        <button class="btn" id="playBtn">Play / Pause</button>
        <button class="btn" id="abBtn">AB Comparison (Bypass)</button>
      </div>

      <div class="canvas-container">
        <canvas id="spectrumCanvas"></canvas>
      </div>

      <div class="controls-grid">
        <!-- EQ Paramétrico -->
        <div class="control-group">
          <h3>EQ Paramétrico</h3>
          <label>Low Gain (60 Hz): <span id="valEqLow">0</span> dB</label>
          <input type="range" id="eqLow" min="-12" max="12" step="0.5" value="0">
          <label>Mid Gain (2.5 kHz): <span id="valEqMid">0</span> dB</label>
          <input type="range" id="eqMid" min="-12" max="12" step="0.5" value="0">
          <label>High Gain (10 kHz): <span id="valEqHigh">0</span> dB</label>
          <input type="range" id="eqHigh" min="-12" max="12" step="0.5" value="0">
        </div>

        <!-- Saturador y Cinta/Vinilo (Existentes) -->
        <div class="control-group">
          <h3>Saturación & Vintage</h3>
          <label>Drive Saturación: <span id="valSat">0</span></label>
          <input type="range" id="satDrive" min="0" max="10" step="0.1" value="0">
          <label>Efecto Cinta / Vinilo: <span id="valTape">0</span>%</label>
          <input type="range" id="tapeMix" min="0" max="100" step="1" value="0">
        </div>

        <!-- Compresor -->
        <div class="control-group">
          <h3>Compresor Dynamic</h3>
          <label>Threshold: <span id="valCompThresh">-24</span> dB</label>
          <input type="range" id="compThresh" min="-60" max="0" step="1" value="-24">
          <label>Ratio: <span id="valCompRatio">4</span>:1</label>
          <input type="range" id="compRatio" min="1" max="20" step="0.5" value="4">
        </div>

        <!-- Módulos Hardstyle (Nuevos) -->
        <div class="control-group">
          <h3>Hardstyle DSP (Nuevo)</h3>
          <label>Hard Clipper Drive: <span id="valClip">1.0</span></label>
          <input type="range" id="clipperDrive" min="1.0" max="5.0" step="0.1" value="1.0">
          <label>Sub Mono Crossfeed (90Hz): <span id="valSubMono">ON</span></label>
          <button class="btn" id="toggleSubMono">Sub Mono: ON</button>
        </div>

        <!-- Limitador Final -->
        <div class="control-group">
          <h3>Limitador Ceiling</h3>
          <label>Peak Ceiling: <span id="valLimiter">-0.1</span> dBFS</label>
          <input type="range" id="limiterCeiling" min="-3.0" max="0.0" step="0.1" value="-0.1">
        </div>
      </div>
    </div>

    <!-- Panel de Análisis -->
    <div class="sidebar">
      <h2>Análisis / LUFS</h2>
      <div style="margin-bottom: 15px;">
        <label>LUFS Estimado:</label>
        <div style="font-size: 1.8em; font-weight: bold; color: var(--accent-neon);" id="lufsValue">- INF dB</div>
      </div>
      <div>
        <label>Peak Signal Level:</label>
        <div class="meter-bar">
          <div class="meter-fill" id="peakMeter"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Configuración Base de Web Audio API
    let audioCtx;
    let audioBuffer = null;
    let sourceNode = null;
    let isPlaying = false;
    let isBypass = false;

    // Nodos de Procesamiento
    let eqLowNode, eqMidNode, eqHighNode;
    let saturationNode, tapeNode, compNode;
    let hardClipperNode, subMonoFilter, limiterNode;
    let analyzerNode, dryGainNode, wetGainNode;

    const audioFileInput = document.getElementById('audioFile');
    const playBtn = document.getElementById('playBtn');
    const abBtn = document.getElementById('abBtn');
    const canvas = document.getElementById('spectrumCanvas');
    const canvasCtx = canvas.getContext('2d');

    // Inicializar Audio Context y la Cadena DSP completa
    function initAudioEngine() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      // 1. EQ Paramétrico
      eqLowNode = audioCtx.createBiquadFilter();
      eqLowNode.type = 'lowshelf';
      eqLowNode.frequency.value = 60;

      eqMidNode = audioCtx.createBiquadFilter();
      eqMidNode.type = 'peaking';
      eqMidNode.frequency.value = 2500;
      eqMidNode.Q.value = 1.0;

      eqHighNode = audioCtx.createBiquadFilter();
      eqHighNode.type = 'highshelf';
      eqHighNode.frequency.value = 10000;

      // 2. Saturación
      saturationNode = audioCtx.createWaveShaper();
      saturationNode.oversampling = '4x';
      updateSaturationCurve(0);

      // 3. Efecto Cinta / Vinilo (Filtro simulador)
      tapeNode = audioCtx.createBiquadFilter();
      tapeNode.type = 'lowpass';
      tapeNode.frequency.value = 20000;

      // 4. Compresor
      compNode = audioCtx.createDynamicsCompressor();
      compNode.threshold.value = -24;
      compNode.ratio.value = 4;

      // 5. Módulo Hard Clipper (Nuevo)
      hardClipperNode = audioCtx.createWaveShaper();
      hardClipperNode.oversampling = '4x';
      updateClipperCurve(1.0);

      // 6. Sub Mono Processing (Nuevo)
      subMonoFilter = audioCtx.createBiquadFilter();
      subMonoFilter.type = 'lowpass';
      subMonoFilter.frequency.value = 90;

      // 7. Limitador
      limiterNode = audioCtx.createDynamicsCompressor();
      limiterNode.threshold.value = -0.1;
      limiterNode.ratio.value = 20;

      // Analizador Visual
      analyzerNode = audioCtx.createAnalyser();
      analyzerNode.fftSize = 1024;

      // Conmutadores A/B Gain
      dryGainNode = audioCtx.createGain();
      wetGainNode = audioCtx.createGain();
      dryGainNode.gain.value = 0; // Inicia escuchando procesado
      wetGainNode.gain.value = 1;
    }

    // Curva Hard Clipper Progresivo
    function updateClipperCurve(drive) {
      const samples = 44100;
      const curve = new Float32Array(samples);
      for (let i = 0; i < samples; ++i) {
        let x = (i * 2) / samples - 1;
        curve[i] = Math.tanh(x * drive);
      }
      if (hardClipperNode) hardClipperNode.curve = curve;
    }

    // Curva de Saturación
    function updateSaturationCurve(amount) {
      const k = amount * 10;
      const samples = 44100;
      const curve = new Float32Array(samples);
      const deg = Math.PI / 180;
      for (let i = 0; i < samples; ++i) {
        let x = (i * 2) / samples - 1;
        curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
      }
      if (saturationNode) saturationNode.curve = curve;
    }

    // Conectar el Ruteo en Cadena del AudioGraph
    function connectPipeline() {
      if (!sourceNode) return;

      // Ruta Seca (Bypass / AB)
      sourceNode.connect(dryGainNode);
      dryGainNode.connect(audioCtx.destination);

      // Ruta Procesada (Efectos existentes + Modulos Hardstyle)
      sourceNode.connect(eqLowNode);
      eqLowNode.connect(eqMidNode);
      eqMidNode.connect(eqHighNode);
      eqHighNode.connect(saturationNode);
      saturationNode.connect(tapeNode);
      tapeNode.connect(compNode);
      compNode.connect(hardClipperNode);
      hardClipperNode.connect(limiterNode);

      limiterNode.connect(wetGainNode);
      wetGainNode.connect(analyzerNode);
      analyzerNode.connect(audioCtx.destination);
    }

    // Cargar archivo de audio
    audioFileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (!audioCtx) initAudioEngine();

      const arrayBuffer = await file.arrayBuffer();
      audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
    });

    // Control Play / Pause
    playBtn.addEventListener('click', () => {
      if (!audioBuffer) return;

      if (isPlaying) {
        sourceNode.stop();
        isPlaying = false;
      } else {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        sourceNode = audioCtx.createBufferSource();
        sourceNode.buffer = audioBuffer;
        sourceNode.loop = true;
        connectPipeline();
        sourceNode.start(0);
        isPlaying = true;
        drawSpectrum();
      }
    });

    // Control Conmutador A/B (Bypass con Gain-Matching)
    abBtn.addEventListener('click', () => {
      isBypass = !isBypass;
      if (isBypass) {
        dryGainNode.gain.value = 1;
        wetGainNode.gain.value = 0;
        abBtn.classList.add('btn-active');
        abBtn.innerText = "AB Comparison (BYPASS ON)";
      } else {
        dryGainNode.gain.value = 0;
        wetGainNode.gain.value = 1;
        abBtn.classList.remove('btn-active');
        abBtn.innerText = "AB Comparison (Bypass)";
      }
    });

    // Eventos UI Controles
    document.getElementById('eqLow').addEventListener('input', (e) => {
      eqLowNode.gain.value = e.target.value;
      document.getElementById('valEqLow').innerText = e.target.value;
    });

    document.getElementById('eqMid').addEventListener('input', (e) => {
      eqMidNode.gain.value = e.target.value;
      document.getElementById('valEqMid').innerText = e.target.value;
    });

    document.getElementById('eqHigh').addEventListener('input', (e) => {
      eqHighNode.gain.value = e.target.value;
      document.getElementById('valEqHigh').innerText = e.target.value;
    });

    document.getElementById('satDrive').addEventListener('input', (e) => {
      updateSaturationCurve(parseFloat(e.target.value));
      document.getElementById('valSat').innerText = e.target.value;
    });

    document.getElementById('clipperDrive').addEventListener('input', (e) => {
      updateClipperCurve(parseFloat(e.target.value));
      document.getElementById('valClip').innerText = e.target.value;
    });

    document.getElementById('tapeMix').addEventListener('input', (e) => {
      // Simula pérdida de agudos al aumentar saturación analógica estilo cinta
      const freq = 20000 - (e.target.value * 120);
      tapeNode.frequency.value = freq;
      document.getElementById('valTape').innerText = e.target.value;
    });

    // Dibujar FFT y Curva de Referencia Hardstyle
    function drawSpectrum() {
      if (!isPlaying) return;
      requestAnimationFrame(drawSpectrum);

      const bufferLength = analyzerNode.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyzerNode.getByteFrequencyData(dataArray);

      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;

      canvasCtx.fillStyle = '#000';
      canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

      // 1. Dibujar Espectro de Frecuencias en Tiempo Real
      const barWidth = (canvas.width / bufferLength) * 2.5;
      let x = 0;
      let sumPeak = 0;

      for (let i = 0; i < bufferLength; i++) {
        const barHeight = (dataArray[i] / 255) * canvas.height;
        sumPeak += dataArray[i];

        canvasCtx.fillStyle = `rgb(0, 255, ${dataArray[i] + 100})`;
        canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);

        x += barWidth + 1;
      }

      // 2. Dibujar Curva de Referencia Visual Hardstyle Overlay
      canvasCtx.beginPath();
      canvasCtx.strokeStyle = '#ff0055';
      canvasCtx.lineWidth = 2;
      canvasCtx.setLineDash([5, 5]);

      // Curva con pico en Sub/Bass (40-60Hz) y elevación en Screeches (2-5kHz)
      canvasCtx.moveTo(0, canvas.height * 0.3); 
      canvasCtx.quadraticCurveTo(canvas.width * 0.1, canvas.height * 0.2, canvas.width * 0.3, canvas.height * 0.6);
      canvasCtx.quadraticCurveTo(canvas.width * 0.6, canvas.height * 0.4, canvas.width, canvas.height * 0.8);
      canvasCtx.stroke();
      canvasCtx.setLineDash([]);

      // Medidor VU / LUFS Simplificado
      const avgPeak = sumPeak / bufferLength;
      const peakPercent = Math.min(100, (avgPeak / 128) * 100);
      document.getElementById('peakMeter').style.width = peakPercent + '%';
      
      const estimatedLUFS = (-30 + (avgPeak / 128) * 24).toFixed(1);
      document.getElementById('lufsValue').innerText = isPlaying ? `${estimatedLUFS} LUFS` : '- INF dB';
    }
  </script>
</body>
</html>
