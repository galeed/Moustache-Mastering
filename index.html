<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Procesador de Audio</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      gap: 20px;
      padding: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .panel {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 20px;
      width: 200px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      text-align: center;
    }
    .panel h3 {
      margin-top: 0;
      color: #00e676;
    }
    .control {
      margin: 15px 0;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.9em;
    }
    input[type=range] {
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- Cuadro 1: Control de Ganancia / dB -->
  <div class="panel">
    <h3>1. Ganancia</h3>
    <div class="control">
      <label for="gainControl">Nivel (dB)</label>
      <input type="range" id="gainControl" min="-24" max="12" value="0" step="0.1">
    </div>
  </div>

  <!-- Cuadro 2: Ecualizador (Filtro) -->
  <div class="panel">
    <h3>2. Ecualización</h3>
    <div class="control">
      <label for="eqFreq">Frecuencia (Hz)</label>
      <input type="range" id="eqFreq" min="20" max="20000" value="1000" step="10">
    </div>
  </div>

  <!-- Cuadro 3: Salida Master -->
  <div class="panel">
    <h3>3. Master</h3>
    <div class="control">
      <label for="masterVolume">Volumen General</label>
      <input type="range" id="masterVolume" min="0" max="1" value="0.8" step="0.01">
    </div>
  </div>

  <!-- Cuadro 4: Saturación Vintage -->
  <div class="panel">
    <h3>4. Saturación Vintage</h3>
    <div class="control">
      <label for="driveControl">Drive (Calidez)</label>
      <input type="range" id="driveControl" min="0" max="100" value="0" step="1">
    </div>
    <div class="control">
      <label for="mixControl">Mezcla (Dry/Wet)</label>
      <input type="range" id="mixControl" min="0" max="1" value="0.5" step="0.05">
    </div>
  </div>

  <script>
    // Configuración del contexto de audio
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    // Creación del nodo WaveShaper para Saturación Vintage
    const saturatorNode = audioCtx.createWaveShaper();

    // Función para calcular la curva de saturación estilo analógico
    function makeDistortionCurve(amount) {
      let k = typeof amount === 'number' ? amount : 50,
        n_samples = 44100,
        curve = new Float32Array(n_samples),
        deg = Math.PI / 180,
        x;
      for (let i = 0; i < n_samples; ++i) {
        x = (i * 2) / n_samples - 1;
        // Algoritmo de transferencia no lineal para simulación vintage
        curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
      }
      return curve;
    }

    // Actualización dinámica de la saturación al mover el slider
    document.getElementById('driveControl').addEventListener('input', (e) => {
      const driveValue = parseInt(e.target.value, 10);
      saturatorNode.curve = makeDistortionCurve(driveValue);
    });
  </script>

</body>
</html>
