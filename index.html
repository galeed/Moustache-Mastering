<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hybrid Studio Console - Fix Audio Loader</title>
    <style>
        :root {
            --bg-color: #0b0c0e;
            --panel-bg: #13151b;
            --panel-border: #222631;
            --accent-orange: #ff5500;
            --accent-cyan: #00e5ff;
            --text-main: #d1d5db;
            --text-muted: #6b7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 12px;
            user-select: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: linear-gradient(180deg, #1a1d26 0%, #12141a 100%);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .brand {
            font-weight: 900;
            font-size: 0.9rem;
            letter-spacing: 1.5px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .brand span {
            color: var(--accent-orange);
            font-size: 0.65rem;
            padding: 2px 4px;
            background: rgba(255, 85, 0, 0.15);
            border: 1px solid var(--accent-orange);
            border-radius: 3px;
        }

        .btn-rack {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            background: #1c202b;
            color: var(--text-main);
            border: 1px solid #2d3345;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--accent-orange);
            color: #000;
            border: none;
        }

        .btn:disabled { opacity: 0.3; cursor: not-allowed; }

        select.export-select {
            background: #12141a;
            color: var(--accent-cyan);
            border: 1px solid var(--panel-border);
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: bold;
            outline: none;
        }

        .console-screen {
            background: #050607;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 8px;
        }

        canvas {
            width: 100%;
            height: 100px;
            background: #000;
            border-radius: 4px;
            display: block;
        }

        .screen-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 4px;
            font-family: monospace;
        }

        .transport-strip {
            background: #13151b;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-play {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--accent-cyan);
            color: #000;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">MOUSTACHE <span>AUDIO LOADER FIX</span></div>
        <div class="btn-rack">
            <input type="file" id="audio-input" accept="audio/*">
            <button class="btn" id="btn-load-file">📂 Seleccionar Audio</button>
            
            <select id="export-sample-rate" class="export-select">
                <option value="44100">44.1 kHz</option>
                <option value="48000" selected>48 kHz</option>
            </select>

            <select id="export-bit-depth" class="export-select">
                <option value="16">16-bit PCM</option>
                <option value="24" selected>24-bit PCM</option>
                <option value="32">32-bit Float</option>
            </select>

            <button class="btn btn-primary" id="export-btn" disabled>💾 Exportar WAV</button>
        </div>
    </header>

    <div class="console-screen">
        <canvas id="spectrum"></canvas>
        <div class="screen-info">
            <span id="track-title">ESPERANDO ARCHIVO DE AUDIO...</span>
            <span id="status-text">ESTADO: INACTIVO</span>
        </div>
    </div>

    <div class="transport-strip">
        <button class="btn-play" id="play-btn" disabled>▶</button>
        <input type="range" id="seek-bar" value="0" min="0" max="100" disabled style="flex:1;">
    </div>

    <script>
        let audioCtx, audioBuffer, sourceNode, isPlaying = false, startTime = 0, pauseOffset = 0;
        let analyserNode;

        const canvas = document.getElementById('spectrum');
        const canvasCtx = canvas.getContext('2d');
        const trackTitle = document.getElementById('track-title');
        const statusText = document.getElementById('status-text');

        // Inicialización garantizada mediante gesto del usuario
        async function ensureAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass();
                
                analyserNode = audioCtx.createAnalyser();
                analyserNode.fftSize = 1024;
                analyserNode.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }
        }

        // Evento de clic en el botón personalizado
        document.getElementById('btn-load-file').addEventListener('click', async () => {
            await ensureAudioContext();
            document.getElementById('audio-input').click();
        });

        // Decodificación compatible (Safari / Chrome / Firefox)
        document.getElementById('audio-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            statusText.textContent = "ESTADO: CARGANDO ARCHIVO...";
            trackTitle.textContent = file.name.toUpperCase();

            try {
                await ensureAudioContext();
                const arrayBuffer = await file.arrayBuffer();

                // Promisificación compatible con navegadores antiguos / Safari
                audioBuffer = await new Promise((resolve, reject) => {
                    audioCtx.decodeAudioData(
                        arrayBuffer,
                        (decodedData) => resolve(decodedData),
                        (error) => reject(error)
                    );
                });

                statusText.textContent = "ESTADO: LISTO PARA REPRODUCIR";
                document.getElementById('play-btn').disabled = false;
                document.getElementById('export-btn').disabled = false;
                document.getElementById('seek-bar').disabled = false;
                
                drawSpectrum();
            } catch (err) {
                console.error("Error al procesar el archivo de audio:", err);
                statusText.textContent = "ERROR: FORMATO NO SOPORTADO";
                alert("Ocurrió un error al cargar o decodificar el archivo. Asegúrate de seleccionar un archivo WAV, MP3, AAC o FLAC válido.");
            }
        });

        function playAudio() {
            if (isPlaying || !audioBuffer) return;
            
            sourceNode = audioCtx.createBufferSource();
            sourceNode.buffer = audioBuffer;
            sourceNode.connect(analyserNode);
            
            sourceNode.start(0, pauseOffset);
            startTime = audioCtx.currentTime - pauseOffset;
            isPlaying = true;
            document.getElementById('play-btn').textContent = '⏸';
            statusText.textContent = "ESTADO: REPRODUCIENDO";
            
            requestAnimationFrame(updateProgress);
        }

        function pauseAudio() {
            if (!isPlaying || !sourceNode) return;
            sourceNode.stop();
            pauseOffset = audioCtx.currentTime - startTime;
            isPlaying = false;
            document.getElementById('play-btn').textContent = '▶';
            statusText.textContent = "ESTADO: PAUSADO";
        }

        document.getElementById('play-btn').addEventListener('click', () => {
            if (isPlaying) pauseAudio(); else playAudio();
        });

        function updateProgress() {
            if (!isPlaying) return;
            let current = audioCtx.currentTime - startTime;
            if (current >= audioBuffer.duration) {
                isPlaying = false;
                pauseOffset = 0;
                document.getElementById('play-btn').textContent = '▶';
                statusText.textContent = "ESTADO: FINALIZADO";
                return;
            }
            document.getElementById('seek-bar').value = (current / audioBuffer.duration) * 100;
            requestAnimationFrame(updateProgress);
        }

        function drawSpectrum() {
            if (!analyserNode) return;
            requestAnimationFrame(drawSpectrum);
            
            const buffer = analyserNode.frequencyBinCount;
            const data = new Uint8Array(buffer);
            analyserNode.getByteFrequencyData(data);

            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            canvasCtx.fillStyle = '#050607';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

            const barWidth = (canvas.width / buffer) * 2;
            let x = 0;
            for (let i = 0; i < buffer; i++) {
                const barHeight = (data[i] / 255) * canvas.height;
                canvasCtx.fillStyle = `rgb(0, ${Math.min(255, data[i] + 80)}, 255)`;
                canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                x += barWidth + 1;
            }
        }

        // Exportación de WAV personalizada
        document.getElementById('export-btn').addEventListener('click', async () => {
            if (!audioBuffer) return;

            statusText.textContent = "ESTADO: EXPORTANDO WAV...";
            const targetSampleRate = parseInt(document.getElementById('export-sample-rate').value);
            const bitDepth = parseInt(document.getElementById('export-bit-depth').value);

            const offlineCtx = new OfflineAudioContext(
                audioBuffer.numberOfChannels,
                Math.ceil(audioBuffer.duration * targetSampleRate),
                targetSampleRate
            );

            const offSource = offlineCtx.createBufferSource();
            offSource.buffer = audioBuffer;
            offSource.connect(offlineCtx.destination);
            offSource.start(0);

            const renderedBuffer = await offlineCtx.startRendering();
            const wavBlob = encodeCustomWAV(renderedBuffer, bitDepth);

            const url = URL.createObjectURL(wavBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `audio_${targetSampleRate}Hz_${bitDepth}bit.wav`;
            a.click();
            
            statusText.textContent = "ESTADO: EXPORTACIÓN COMPLETA";
        });

        function encodeCustomWAV(audioBuffer, bitDepth) {
            const numChannels = audioBuffer.numberOfChannels;
            const sampleRate = audioBuffer.sampleRate;
            const numSamples = audioBuffer.length;
            const bytesPerSample = bitDepth / 8;
            const blockAlign = numChannels * bytesPerSample;
            const dataSize = numSamples * blockAlign;
            const buffer = new ArrayBuffer(44 + dataSize);
            const view = new DataView(buffer);

            const writeString = (offset, str) => {
                for (let i = 0; i < str.length; i++) {
                    view.setUint8(offset + i, str.charCodeAt(i));
                }
            };

            writeString(0, 'RIFF');
            view.setUint32(4, 36 + dataSize, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, bitDepth === 32 ? 3 : 1, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * blockAlign, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitDepth, true);
            writeString(36, 'data');
            view.setUint32(40, dataSize, true);

            let offset = 44;
            const channels = [];
            for (let i = 0; i < numChannels; i++) channels.push(audioBuffer.getChannelData(i));

            for (let i = 0; i < numSamples; i++) {
                for (let ch = 0; ch < numChannels; ch++) {
                    let sample = Math.max(-1, Math.min(1, channels[ch][i]));

                    if (bitDepth === 16) {
                        sample = sample < 0 ? sample * 32768 : sample * 32767;
                        view.setInt16(offset, sample, true);
                        offset += 2;
                    } else if (bitDepth === 24) {
                        sample = sample < 0 ? sample * 8388608 : sample * 8388607;
                        let intSample = Math.floor(sample);
                        view.setUint8(offset, intSample & 0xFF);
                        view.setUint8(offset + 1, (intSample >> 8) & 0xFF);
                        view.setUint8(offset + 2, (intSample >> 16) & 0xFF);
                        offset += 3;
                    } else if (bitDepth === 32) {
                        view.setFloat32(offset, sample, true);
                        offset += 4;
                    }
                }
            }
            return new Blob([buffer], { type: 'audio/wav' });
        }
    </script>
</body>
</html>
